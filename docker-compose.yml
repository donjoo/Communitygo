  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #   depends_on:
  #     - redis
  #     - db
  #   restart: always


  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: celery -A backend worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=backend.settings
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://don:don@mydb@db:5432/mydb
    depends_on:
      - redis
      - backend
    restart: always

