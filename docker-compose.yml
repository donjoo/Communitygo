

services:
  redis:
    image: redis:alpine
    container_name: communitygo-redis-1
    ports:
      - "6379:6379"
    restart: always

  db:
    image:  postgis/postgis:15-3.4
    container_name: communitygo-postgres-1
    # env_file:
    #   - ./backend/.env
    environment:
      POSTGRES_USER: don
      POSTGRES_PASSWORD: don@mydb   # Set a password here
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U don -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app  
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: always

  # frontend:
  #   image: communitygo-frontend
  #   ports:
  #     - "3000:80"
  #   volumes:
  #     - ./frontend:/app  
  #     - /app/node_modules
  #   env_file:
  #     - ./frontend/.env
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true
  #   restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
      - "8001:8001"  # Added port for Daphne

    volumes:
      - ./backend:/app  
      - /tmp/daphne.sock:/tmp/daphne.sock
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=backend.settings
      - GDAL_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libgdal.so
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://don:don@mydb@db:5432/mydb

    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

    restart: always

